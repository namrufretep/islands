name: Tierra del Fuego artwork build
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_tierra_del_fuego.py'
      - 'scripts/import_tierra_del_fuego_terrain.py'
      - 'scripts/review_tierra_del_fuego.py'
      - '.github/workflows/tierra_del_fuego-preview.yml'
permissions:
  contents: read
jobs:
  coastline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install geopandas==1.0.1 shapely==2.0.7 pyproj==3.7.1
      - run: python scripts/import_tierra_del_fuego.py
      - uses: actions/upload-artifact@v4
        with:
          name: tierra_del_fuego-coastline
          path: data/gis/000012/coastline/
          if-no-files-found: error
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rasterio==1.4.3 numpy==2.2.3
      - run: python scripts/import_tierra_del_fuego_terrain.py
      - uses: actions/upload-artifact@v4
        with:
          name: tierra_del_fuego-terrain
          path: data/gis/000012/terrain/
          if-no-files-found: error
  render:
    needs: [coastline, terrain]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: tierra_del_fuego-coastline
          path: data/gis/000012/coastline
      - uses: actions/download-artifact@v4
        with:
          name: tierra_del_fuego-terrain
          path: data/gis/000012/terrain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely==2.0.7 pyproj==3.7.1 numpy==2.2.3 cairosvg pillow scipy scikit-image
      - run: python scripts/review_tierra_del_fuego.py
      - run: python scripts/render_island.py data/gis/000012/coastline/000012-candidate-00.svg review-output/tierra_del_fuego-coastline.json public/drafts/000012 --palette tierra_del_fuego --expanded-tones
      - name: Check both finished artworks
        run: |
          test -s public/drafts/000012/000012-N-draft.svg
          test -s public/drafts/000012/000012-S-draft.svg
          test -s public/drafts/000012/000012-N-draft.png
          test -s public/drafts/000012/000012-S-draft.png
          for v in A C; do for e in N S; do test -s public/drafts/000012/000012-$e-$v-study.svg; done; done
      - uses: actions/upload-artifact@v4
        with:
          name: tierra_del_fuego-soft-stone-north-south
          path: |
            public/drafts/000012/*-draft.svg
            public/drafts/000012/*-draft.png
            public/drafts/000012/*-draft.json
            public/drafts/000012/*-study.svg
            public/drafts/000012/*-study.json
          if-no-files-found: error
      - name: Publish both editions
        run: |
          cp data/gis/000012/coastline/000012-candidate-00.svg public/drafts/000012/coastline-candidate.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/drafts/000012 review-output/tierra_del_fuego-coastline.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Tierra del Fuego Soft Stone artwork editions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
