name: Isle of Man dark background studies
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/isle_of_man_dark_backgrounds.py
      - .github/workflows/isle-of-man-dark.yml
permissions:
  contents: write
jobs:
  studies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cairosvg pillow
      - run: python scripts/isle_of_man_dark_backgrounds.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/drafts/000011/dark
          git diff --cached --quiet || git commit -m "Publish Isle of Man dark background studies"
          git pull --rebase
          git push
