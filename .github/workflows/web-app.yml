name: Web app checks
on:
  push:
    paths:
      - 'src/**'
      - 'scripts/build-*.mjs'
      - 'package*.json'
      - '.github/workflows/web-app.yml'
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
