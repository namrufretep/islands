name: Classify island duplicate candidates
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/review_island_duplicates.py
      - .github/workflows/review-island-duplicates.yml
      - docs/world-island-audit.json
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/review_island_duplicates.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/island-duplicate-review.json
          git diff --cached --quiet || git commit -m "Classify geographic duplicate candidates"
          git pull --rebase
          git push
