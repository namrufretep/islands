name: Read-only Base Sepolia deployment diagnostic
on:
  push:
    branches: [diagnose-sepolia-wallet]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/diagnose-sepolia-wallet.mjs
