name: Island GIS import
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_island.py'
      - 'scripts/import_terrain.py'
      - 'scripts/review_bouvet.py'
      - 'scripts/render_island.py'
      - '.github/workflows/island-gis.yml'
permissions:
  contents: read
jobs:
  bouvet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install geopandas==1.0.1 shapely==2.0.7 pyproj==3.7.1
      - run: python scripts/import_island.py --url https://publicdata.npolar.no/kartdata/NP_B20_SHP.zip --lat -54.42 --lon 3.36 --id 000001 --output gis-output
      - uses: actions/upload-artifact@v4
        with:
          name: bouvet-coastline-candidates
          path: gis-output/
          if-no-files-found: error
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rasterio==1.4.3 numpy==2.2.3
      - run: python scripts/import_terrain.py --url https://publicdata.npolar.no/kartdata/NP_B0_DTM20.zip --lat -54.42 --lon 3.36 --output terrain-output
      - uses: actions/upload-artifact@v4
        with:
          name: bouvet-terrain-candidates
          path: terrain-output/
          if-no-files-found: error
  persist:
    needs: [bouvet, terrain]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: bouvet-coastline-candidates
          path: data/gis/000001/coastline
      - uses: actions/download-artifact@v4
        with:
          name: bouvet-terrain-candidates
          path: data/gis/000001/terrain
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gis/000001
          if ! git diff --cached --quiet; then
            git commit -m "Persist unverified Bouvet GIS candidates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely==2.0.7 pyproj==3.7.1 numpy==2.2.3 cairosvg pillow scipy scikit-image
      - run: python scripts/review_bouvet.py
      - run: python scripts/render_island.py data/gis/000001/coastline/000001-candidate-00.svg review-output/coastline.json public/drafts/000001
      - run: |
          git add review-output public/drafts/000001
          if ! git diff --cached --quiet; then
            git commit -m "Generate geography-locked Bouvet artwork drafts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
