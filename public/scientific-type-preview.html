<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISLANDS — Scientific Type 04 · Design Study</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07131d;color:#e9f3f4;font:14px system-ui,-apple-system,sans-serif}
header{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 16px;background:#0b2030;border-bottom:1px solid #2d5260}
header strong{letter-spacing:.12em;font-size:14px}header small{display:block;color:#a4c1c9;font-size:10px;margin-top:3px}
.actions{display:flex;gap:8px;align-items:center}button,a.action{background:#193848;color:#d8eff0;border:1px solid #527c86;border-radius:8px;padding:10px 12px;text-decoration:none;font-size:12px;cursor:pointer}
button[aria-pressed=true]{background:#b9d9e0;color:#0b2030;font-weight:700}main{height:calc(100dvh - 64px)}iframe{display:block;border:0;width:100%;height:100%;background:#0b2030}
@media(min-width:850px){main{display:grid;place-items:center;padding:18px}iframe{width:min(100%,760px);border:1px solid #375969;border-radius:16px;box-shadow:0 15px 55px #0007}}
@media(max-width:540px){header{padding:8px;height:67px}header strong{font-size:12px}header small{font-size:9px}.actions{gap:4px}button,a.action{font-size:11px;padding:8px}main{height:calc(100dvh - 67px)}}
</style></head><body>
<header><div><strong>◈ ISLANDS · SCIENTIFIC TYPE 04</strong><small>TYPOGRAPHY 04 · ORIGINAL APP UNCHANGED</small></div><div class="actions"><button id="scientific" aria-pressed="true">Scientific Type 04</button><button id="original" aria-pressed="false">Original</button><a class="action" href="/" target="_blank" rel="noopener">Open App ↗</a></div></header>
<main><iframe id="app" src="/" title="ISLANDS actual app with selectable Scientific Type 04 theme"></iframe></main>
<script>
const frame=document.getElementById('app');
let selected='scientific';
const css=`
/* ISLANDS / TYPE STUDY 04: technical typography; original colors retained */
:root{font-family:Arial,Helvetica,sans-serif!important;font-feature-settings:"tnum" 1,"ss01" 1!important}
body{font-family:Arial,Helvetica,sans-serif!important}
.brand{font-family:"Arial Narrow",Arial,Helvetica,sans-serif!important;font-size:clamp(25px,6.4vw,39px)!important;font-weight:800!important;letter-spacing:-.085em!important;line-height:.92!important}
.brand small{font-family:"Courier New",monospace!important;font-size:9px!important;font-weight:400!important;letter-spacing:.12em!important;line-height:1.8!important}
h1{font-family:"Arial Narrow",Arial,Helvetica,sans-serif!important;font-size:clamp(52px,13vw,91px)!important;font-weight:800!important;letter-spacing:-.085em!important;line-height:.87!important;margin:20px 0 26px!important;max-width:100%;overflow-wrap:break-word}
h2,.islandtitle h2{font-family:Arial,Helvetica,sans-serif!important;font-weight:650!important;letter-spacing:-.055em!important}
.islandtitle h2{font-size:clamp(36px,9vw,58px)!important;line-height:1!important}
.eyebrow{font-family:"Courier New",monospace!important;font-size:10px!important;letter-spacing:.14em!important;font-weight:700!important}
#atlas .eyebrow::before{content:"01 / ";opacity:.7}
#gallery .eyebrow::before{content:"02 / ";opacity:.7}
#index .eyebrow::before{content:"03 / ";opacity:.7}
#atlas h1::after{content:"WORLD GEOGRAPHIC REGISTRY    /    001—∞";display:block;margin-top:17px;border-top:1px solid #365564;padding-top:11px;font:10px/1.6 "Courier New",monospace;letter-spacing:.08em;color:#8ddbea}
.atlasrow{grid-template-columns:minmax(0,1fr) 54px 54px!important;gap:10px!important;padding:17px 0!important}
.atlasrow strong,.indexrow strong{display:block;font-family:"Arial Narrow",Arial,sans-serif!important;font-size:clamp(21px,5.5vw,30px)!important;font-weight:700!important;letter-spacing:-.055em!important;line-height:1.1!important;overflow-wrap:anywhere}
.atlasrow small,.indexrow small,.editionstatus,.atlasfacts,.galleryhead,.artlabel,.artnumber,.tag,.galleryedition small,.galleryedition p,.mintmode b,.mintinventory small{font-family:"Courier New",monospace!important;font-size:10px!important;letter-spacing:.035em!important}
.atlasfacts{font-variant-numeric:tabular-nums!important}
.atlasfacts div{font-size:clamp(18px,4vw,25px)!important;font-weight:700!important;letter-spacing:-.05em!important}
.atlasfacts small{font-size:9px!important;font-weight:400!important;letter-spacing:.08em!important}
#atlasSearch,#indexSearch,#atlasFilter,#indexSort{font-family:"Courier New",monospace!important;font-size:12px!important}
.mintmode strong,.pricecard strong{font-variant-numeric:tabular-nums!important;letter-spacing:-.04em!important}
nav button{font-family:"Courier New",monospace!important;font-size:9px!important;letter-spacing:-.04em!important}
#atlas .maplegend{font-family:"Courier New",monospace!important;font-size:10px!important}
button:focus-visible,input:focus-visible{outline:2px solid #8ddbea!important;outline-offset:3px!important}
`;
function apply(){try{const doc=frame.contentDocument;if(!doc)return;let style=doc.getElementById('islands-scientific-type-study');if(selected==='scientific'){if(!style){style=doc.createElement('style');style.id='islands-scientific-type-study';style.textContent=css;doc.head.append(style)}}else style?.remove()}catch(e){document.querySelector('header small').textContent='Preview unavailable — open app instead'}}
function choose(theme){selected=theme;document.getElementById('scientific').setAttribute('aria-pressed',theme==='scientific');document.getElementById('original').setAttribute('aria-pressed',theme==='original');apply()}
document.getElementById('scientific').onclick=()=>choose('scientific');
document.getElementById('original').onclick=()=>choose('original');
frame.addEventListener('load',apply);
</script></body></html>
