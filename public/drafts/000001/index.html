<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISLANDS · Bouvetøya Art Studio</title><style>body{background:#07131e;color:#e4eff1;font:16px system-ui;margin:0;padding:24px}main{max-width:1100px;margin:auto}small,p{color:#9db9c5}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}article{min-width:0}img{width:100%;display:block;border:1px solid #294453}a{color:#afe5df}@media(max-width:550px){section{grid-template-columns:1fr}}</style></head><body><main><small>ISLANDS · ART STUDIO · UNRELEASED</small><h1>Bouvetøya</h1><p>Glacial Turquoise &amp; Volcanic Ash · Geographic coastline from Norwegian Polar Institute · Experimental artwork</p><section><article><h2>#000001-N · North-Up</h2><img id="n" alt="North-Up artwork draft"></article><article><h2>#000001-S · South-Up</h2><img id="s" alt="South-Up artwork draft"></article></section><p id="status">Checking draft version…</p><a href="/">Return to ISLANDS</a></main><script>const stamp=Date.now();Promise.all(['N','S'].map(async e=>{const url='000001-'+e+'-draft.svg?'+stamp;const r=await fetch(url);if(!r.ok)throw Error('Draft unavailable');const svg=await r.text();document.getElementById(e.toLowerCase()).src=url;return svg.includes('data-art-version="3.3"')})).then(v=>{document.getElementById('status').textContent=v.every(Boolean)?'Art style v3.3 · Sculptural Vector · 85% island extent, Glacier and Porcelain backgrounds.':'Earlier or mixed draft versions · Updated render not yet deployed.'}).catch(()=>{document.getElementById('status').textContent='Draft verification unavailable.'});</script></body></html>
