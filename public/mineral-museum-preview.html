<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISLANDS — Mineral Museum · Design Study</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#d8d1c4;color:#302f2c;font:14px system-ui,-apple-system,sans-serif}
header{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 16px;background:#f5f1e9;border-bottom:1px solid #c8bbab}
header strong{color:#302f2c;letter-spacing:.12em;font-size:14px}header small{display:block;color:#81796f;font-size:10px;margin-top:3px}
.actions{display:flex;gap:8px;align-items:center}button,a.action{background:#eee8dc;color:#302f2c;border:1px solid #b5a89a;border-radius:8px;padding:10px 12px;text-decoration:none;font-size:12px;cursor:pointer}
button[aria-pressed=true]{background:#a06f55;color:#fffaf3;font-weight:700}main{height:calc(100dvh - 64px)}iframe{display:block;border:0;width:100%;height:100%;background:#e7e2d7}
@media(min-width:850px){main{display:grid;place-items:center;padding:18px}iframe{width:min(100%,760px);border:1px solid #375969;border-radius:16px;box-shadow:0 15px 55px #0007}}
@media(max-width:540px){header{padding:8px;height:67px}header strong{font-size:12px}header small{font-size:9px}.actions{gap:4px}button,a.action{font-size:11px;padding:8px}main{height:calc(100dvh - 67px)}}
</style></head><body>
<header><div><strong>◈ ISLANDS · MINERAL MUSEUM</strong><small>LIVE DESIGN STUDY · ORIGINAL APP UNCHANGED</small></div><div class="actions"><button id="mineral" aria-pressed="true">Mineral Museum</button><button id="original" aria-pressed="false">Original</button><a class="action" href="/" target="_blank" rel="noopener">Open App ↗</a></div></header>
<main><iframe id="app" src="/" title="ISLANDS actual app with selectable Mineral Museum theme"></iframe></main>
<script>
const frame=document.getElementById('app');
let selected='mineral';
const css=`
:root{color-scheme:light!important;background:#e7e2d7!important;color:#302f2c!important}
body{background:radial-gradient(ellipse at 25% -10%,#faf7ef 0%,#e7e2d7 54%,#d7cfc2 100%)!important;color:#302f2c!important}
.brand,.brand strong,h1,h2,h3,.mintinventory strong,.pricecard strong,.mintmode strong,.mintmode b,.islandtitle h2{color:#302f2c!important}
.brand small,small,.tiers,.editionstatus,.atlasrow small,.indexrow small{color:#827a71!important}
p,#status,.maplegend,.mintinventory,.mintmode span{color:#655f57!important}
.eyebrow,.tag,.selected,.link,.pricecard em,a,nav button.active,.gallerysymbol,.empty,.mintpreview summary{color:#925e45!important}
.panel,.pricecard,.empty,.mintmode,.galleryempty,.galleryedition{background:#f5f1e9!important;border-color:#cfc2b1!important;color:#302f2c!important}
.mintmode.active{background:#eee0cf!important;border-color:#a06f55!important}
.primary{background:#a06f55!important;color:#fffaf3!important}
.outline,.tag,.panel input:not([type=range]),#atlasSearch,#atlasFilter,#indexSearch,#indexSort,.mintselection select{border-color:#b9aa99!important;color:#554a40!important}
.panel input:not([type=range]),#atlasSearch,#atlasFilter,#indexSearch,#indexSort,.mintselection select{background:#fffdf8!important;color:#302f2c!important}
nav{background:#f5f1e9!important;border-color:#cfc2b1!important}nav button{color:#827a71!important}nav button.active{border-top-color:#a06f55!important}
header,.atlasfacts,.atlasrow,.indexrow,.rotationControls,.mintinventory,.galleryhead{border-color:#cfc2b1!important}
#worldMap{border-color:#b9aa99!important;background:#e2ded3!important}
#worldMap .leaflet-tile-pane{filter:grayscale(.75) sepia(.18) saturate(.65)!important}
#worldMap .leaflet-container{background:#e7e2d7!important}
.art,.mintvisual{background:radial-gradient(ellipse at 35% 20%,#f5ede0,#ded6c9 72%)!important;border-color:#cfc2b1!important}
.artlabel,.artnumber,.galleryhead,.galleryindex{color:#81796f!important}
.mystery-island{background:#e1d3c3!important;color:#a06f55!important}
.mintvisual strong,.mintvisual small{color:#655f57!important}
button:focus-visible,input:focus-visible{outline-color:#a06f55!important}
`;
function apply(){try{const doc=frame.contentDocument;if(!doc)return;let style=doc.getElementById('islands-mineral-museum-study');if(selected==='mineral'){if(!style){style=doc.createElement('style');style.id='islands-mineral-museum-study';style.textContent=css;doc.head.append(style)}}else style?.remove()}catch(e){document.querySelector('header small').textContent='Preview unavailable — open app instead'}}
function choose(theme){selected=theme;document.getElementById('mineral').setAttribute('aria-pressed',theme==='mineral');document.getElementById('original').setAttribute('aria-pressed',theme==='original');apply()}
document.getElementById('mineral').onclick=()=>choose('mineral');
document.getElementById('original').onclick=()=>choose('original');
frame.addEventListener('load',apply);
</script></body></html>
